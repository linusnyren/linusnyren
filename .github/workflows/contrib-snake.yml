name: 🐍 Contribution snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/contrib-snake.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#b5651d&color_dots=#ebedf0,#ffd6f5,#ff9ce6,#ff4fd8,#c4009b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffe259&color_dots=#161b22,#3d1d66,#7a1fa2,#ff2bd6,#00f0ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
